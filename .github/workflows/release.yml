# Release builds: push a tag like v0.2.0 and this publishes a DRAFT GitHub
# release with installers for macOS (universal), Windows, and Linux, plus the
# signed latest.json manifest the in-app updater consumes. Publish the draft
# to ship it.
#
# Before tagging: bump the version in app/src-tauri/tauri.conf.json AND the
# workspace Cargo.toml so the manifest version matches the tag.
#
# Required repo secret (already set): TAURI_SIGNING_PRIVATE_KEY.
# Optional, for OS code signing when you have the certificates:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID  (macOS Developer ID + notarization)
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD  (Windows Authenticode)
name: Release

on:
  push:
    tags:
      - 'v[0-9]+*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bundle formats come from tauri.conf.json ("targets": "all") —
          # the CLI has no --bundle flag (first live run failed on it).
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        working-directory: app
        run: npm install

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # macOS Developer ID signing + notarization — active as soon as the
          # APPLE_* secrets exist; harmless empty otherwise.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: VibeSync ${{ github.ref_name }}
          releaseBody: See the assets below to download this version. `latest.json` is the auto-updater manifest.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
