name: CI

on:
  push:
    branches: [main]
    # Docs/chore-only pushes don't touch code — don't spend runner money
    # on them. If EVERY changed file matches, no run starts at all.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'packaging/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'packaging/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Pushing twice in quick succession makes the first run stale — cancel it
# instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job per OS: `cargo test --workspace` already runs the engine suite,
  # so a separate engine job doubled the bill for zero extra coverage.
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast: one failing test binary must not hide the others
      # (a single Windows failure in the engine's unit tests used to skip
      # every integration suite on that platform).
      - run: cargo test --workspace --no-fail-fast

  # The UI's decision logic (escaping, the setup gates, the finish flow)
  # lives in app/ui/ui-logic.js and is tested with Node's built-in runner —
  # no npm install, no dependencies.
  ui:
    name: UI logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: node --test app/ui/tests/ui-logic.test.js
