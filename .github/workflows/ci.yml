name: CI

# Runs on pull requests only, and only when Rust code (or this file) changes.
#
# Not on push to main: every change reaches main through a PR that already
# ran these exact checks, so the merge re-ran identical code — the Windows
# job twice per change for nothing. (Branch protection's "require branches
# to be up to date before merging" guarantees the merged tree is the one
# that was tested.) For anything else — a direct push, a re-check — run it
# by hand: Actions -> CI -> Run workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'engine/**'
      - 'app/src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Pushing twice in quick succession makes the first run stale — cancel it
# instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS first: most failures show up on any platform, so a broken PR stops
  # here instead of also spending ~10 minutes on Windows. Draft PRs wait.
  macos:
    name: Tests (macos-latest)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast: one failing test binary must not hide the others.
      - run: cargo test --workspace --no-fail-fast

  # Windows only once macOS is green — it is the slow, expensive runner, and
  # still the only place Windows-only bugs (paths, file locking) show up.
  windows:
    name: Tests (windows-latest)
    needs: macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast
