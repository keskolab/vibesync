[package]
name = "vibesync-engine"
description = "VibeSync engine: scanning, path tokenization, state tracking, and sync backends"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
flate2 = "1"
filetime = "0.2"
dirs = "6"
age = "0.11"
rusty-s3 = "0.7"
ureq = "2"
url = "2"
gethostname = "1"
rayon = "1"
scrypt = { version = "0.11", default-features = false }
bech32 = "0.9"
percent-encoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
mini-log = "0.1.3"

[dev-dependencies]
tempfile = "3"
