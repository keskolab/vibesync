[package]
name = "vibesync-app"
description = "VibeSync — tray app syncing AI coding sessions between your machines"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "vibesync_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The executable is named after the crate by default ("vibesync-app"), and
# macOS Login Items displays the executable name for dev builds. Name it like
# the product so every surface says VibeSync.
[[bin]]
name = "VibeSync"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
url = "2"
vibesync-engine = { path = "../../engine" }
