ShortDescription: Keep your AI coding sessions in sync across all your computers.
Description: >-
  VibeSync is a small system tray app that keeps AI coding sessions
  (Claude Code, Codex, VS Code Copilot Chat, Copilot CLI, OpenCode, Zed)
  in sync across macOS and Windows machines, using storage you control —
  a synced folder, your own cloud bucket, or a USB disk. End-to-end
  encrypted for cloud storage; no account, no middleman server.
